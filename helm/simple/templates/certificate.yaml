{{- if and .Values.route.hostname .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scd-reporting-simple.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.certManager.secretName }}
  issuerRef:
    name: {{ .Values.certManager.clusterIssuer }}
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.route.hostname }}
  # A fresh key per issuance. With the pre-1.18 default (Never) a forced
  # reissue resubmits the previous CSR and the InCommon ACME server rejects it
  # as badCSR "CSR of an existing certificate order".
  privateKey:
    rotationPolicy: {{ .Values.certManager.privateKeyRotationPolicy }}
{{- end }}
