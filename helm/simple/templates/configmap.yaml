{{- if and .Values.vault.addr (not .Values.vault.secretPath) }}
{{- fail "vault.addr is set but vault.secretPath is empty — the app would ignore Vault and boot on ConfigMap/Secret values. Set vault.secretPath (e.g. okd/shared/prod/scd-reporting) or clear vault.addr." }}
{{- end }}
{{- if and .Values.vault.secretPath (not .Values.vault.addr) }}
{{- fail "vault.secretPath is set but vault.addr is empty — both are required to enable the Vault loader." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scd-reporting-simple.labels" . | nindent 4 }}
data:
  DJANGO_SETTINGS_MODULE: {{ .Values.django.settingsModule | quote }}
  DJANGO_ALLOWED_HOSTS: {{ if .Values.route.hostname }}{{ printf "%s,%s" .Values.route.hostname .Values.django.allowedHosts | quote }}{{ else }}{{ .Values.django.allowedHosts | quote }}{{ end }}
  {{- if .Values.route.hostname }}
  CSRF_TRUSTED_ORIGINS: {{ printf "https://%s" .Values.route.hostname | quote }}
  {{- end }}
  ACCOUNT_EMAIL_VERIFICATION: {{ .Values.django.emailVerification | quote }}
  SCD_DISABLE_LOCAL_SIGNUP: {{ .Values.django.disableLocalSignup | quote }}
  LOCAL_LOGIN_ENABLED: {{ .Values.django.localLoginEnabled | quote }}
  SCD_INITIAL_ADMIN_USERNAME: {{ .Values.django.initialAdminUsername | quote }}
  SCD_INITIAL_ADMIN_EMAIL: {{ .Values.django.initialAdminEmail | quote }}
  DATABASE_URL: {{ .Values.database.url | quote }}
  GUNICORN_WORKERS: {{ .Values.gunicorn.workers | quote }}
  GUNICORN_TIMEOUT: {{ .Values.gunicorn.timeout | quote }}
  GUNICORN_LOG_LEVEL: {{ .Values.gunicorn.logLevel | quote }}
  ANTHROPIC_SUMMARY_MODEL: {{ .Values.anthropic.summaryModel | quote }}
  ANTHROPIC_BASE_URL: {{ .Values.anthropic.baseUrl | quote }}
  EMAIL_HOST: {{ .Values.email.host | quote }}
  EMAIL_PORT: {{ .Values.email.port | quote }}
  EMAIL_HOST_USER: {{ .Values.email.user | quote }}
  DEFAULT_FROM_EMAIL: {{ .Values.email.defaultFrom | quote }}
  REMINDER_BASE_URL: {{ if .Values.reminders.baseUrl }}{{ .Values.reminders.baseUrl | quote }}{{ else if .Values.route.hostname }}{{ printf "https://%s" .Values.route.hostname | quote }}{{ else }}""{{ end }}
  REMINDER_MIN_INTERVAL_HOURS: {{ .Values.reminders.minIntervalHours | quote }}
  REMINDER_STALE_DAYS: {{ .Values.reminders.staleDays | quote }}
  REMINDER_BATCH_SIZE: {{ .Values.reminders.batchSize | quote }}
  REMINDER_SCHEDULER_ENABLED: {{ .Values.reminders.inProcessScheduler | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.google.clientId | quote }}
  OIDC_PROVIDER_URL: {{ .Values.oidc.providerUrl | quote }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  {{- if .Values.vault.addr }}
  VAULT_ADDR: {{ .Values.vault.addr | quote }}
  VAULT_APPROLE: {{ .Values.vault.role | quote }}
  VAULT_APPROLE_MOUNT: {{ .Values.vault.mount | quote }}
  VAULT_SECRET_PATH: {{ .Values.vault.secretPath | quote }}
  {{- if .Values.vault.optional }}
  VAULT_OPTIONAL: {{ .Values.vault.optional | quote }}
  {{- end }}
  {{- end }}
