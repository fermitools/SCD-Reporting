# Default values for scd-reporting-simple.
# Override with:  helm install ... -f my-values.yaml  or  --set key=value

image:
  repository: docker.io/normanajn/scd-reporting-web
  tag: latest
  pullPolicy: Always

replicaCount: 1

service:
  type: ClusterIP
  port: 8000

# ── OKD Route ─────────────────────────────────────────────────────────────────
route:
  # Set to the public hostname to create an OKD Route with TLS edge termination.
  # Leave empty to skip Route creation.
  hostname: ""
  # HAProxy router request timeout. The cluster default is 30s, which cuts off
  # long AI-summary requests before gunicorn (GUNICORN_TIMEOUT) returns. Keep
  # this >= gunicorn.timeout. HAProxy's is an inactivity timeout, so a streamed
  # summary keeps resetting it, but the blocking endpoint still needs the room.
  timeout: 600s
  # Adds the `ingresscontroller: <value>` label to the Route, which is how the
  # cluster's IngressControllers shard routes between routers. This value MUST
  # agree with where scd-reporting.fnal.gov points in DNS — changing one without
  # the other is a hard outage (503 "Application is not available").
  #
  # As of 2026-08-06 DNS is:
  #   scd-reporting.fnal.gov -> okdprod1-ingress.fnal.gov -> 131.225.163.71
  # which is the public-proxy router (default cert *.apps.okdprod.fnal.gov).
  # Do not change this back to "" without moving DNS back to 131.225.163.40
  # (the default router). See README.md "Router sharding".
  ingressController: public-proxy

# ── cert-manager ───────────────────────────────────────────────────────────────
certManager:
  enabled: false
  clusterIssuer: incommon-acme
  secretName: scd-reporting-tls
  # Set to true only after the Certificate has been issued and the secret exists.
  # This wires the secret into the Route and grants the OKD router RBAC access.
  externalCertificate: false

# ── Container resources ───────────────────────────────────────────────────────
# Sized for gunicorn.workers above. CPU is generous relative to actual use (the
# pod idles at ~2m) because gunicorn workers need burst headroom to render, and
# a throttled worker holds its request open for longer.
resources:
  limits:
    cpu: 1000m
    memory: 640Mi
  requests:
    cpu: 250m
    memory: 320Mi

pvc:
  sqliteData:
    size: 1Gi
  media:
    size: 1Gi

# ── Django core ────────────────────────────────────────────────────────────────
django:
  settingsModule: scd_reporting.settings.dev
  # REQUIRED – set in my-values.yaml, never commit a real value here
  secretKey: ""
  allowedHosts: "localhost,127.0.0.1"
  emailVerification: optional   # none | optional | mandatory
  disableLocalSignup: "0"
  localLoginEnabled: "0"
  initialAdminUsername: scd-admin
  initialAdminEmail: scd-admin@fnal.gov
  # REQUIRED – set in my-values.yaml, never commit a real value here
  initialAdminPassword: ""

# ── Database ───────────────────────────────────────────────────────────────────
database:
  url: "sqlite:////app/data/db.sqlite3"

# ── Gunicorn ───────────────────────────────────────────────────────────────────
gunicorn:
  # Long AI-summary requests are I/O-bound on the Anthropic API and touch the
  # database almost not at all, but they hold a worker for their whole duration.
  # With timeout raised to 600 for streaming, three workers meant two slow
  # summaries left the site running on one. Six gives room without meaningfully
  # increasing database contention, because those requests are not what contends.
  #
  # Sizing: measured working set is ~185 MiB for three workers, with roughly
  # 45 MiB marginal per additional worker once pages shared with the master are
  # discounted — so six fits inside a 640 MiB limit with headroom.
  workers: 6
  logLevel: info
  # Worker request timeout (seconds). Must exceed the slowest AI-summary
  # generation; the default gunicorn timeout of 30s kills the worker mid-call.
  #
  # This is a hard ceiling on a streamed summary too — a worker streaming a
  # response for longer than this is reaped mid-stream, verified by measurement,
  # and the threaded worker class behaves the same. Raised to 600 to give the
  # streaming endpoint room for anthropic.streamMaxTokens; the cost is that a
  # genuinely hung worker now takes 10 minutes to reap, and there are only three.
  timeout: 600

# ── AI summaries ───────────────────────────────────────────────────────────────
anthropic:
  apiKey: ""
  summaryModel: "claude-sonnet-5"
  baseUrl: ""
  # Output ceiling for one generated summary. The default prompt asks for a
  # table row per entry, so this needs to be generous; a summary that still hits
  # the ceiling is flagged as incomplete in the UI rather than passed off as
  # finished.
  #
  # Capped by the 300s gunicorn/route timeout rather than by the model, which
  # takes up to 128000: at the ~88 output tokens/second measured through the
  # LiteLLM proxy, about 26000 tokens fit in 300s. Raise gunicorn.timeout and
  # route.timeout to match before raising this much further.
  maxTokens: "24000"
  # Largest prompt the summariser will send. Suits a 1M-context model; lower it
  # to ~150000 for a 200k-context model. "0" disables the check.
  maxInputTokens: "400000"
  # Output ceiling for the streamed summary endpoint (/reports/summary/stream/).
  # Bounded by gunicorn.timeout, not by the model: a worker is reaped mid-stream
  # once it exceeds that, so keep
  #     streamMaxTokens <= (gunicorn.timeout - 20s) * 88 tokens/sec
  # with margin. "0" falls back to maxTokens.
  streamMaxTokens: "40000"

# ── Email (SMTP) ───────────────────────────────────────────────────────────────
# The lab gateway is smtp.fnal.gov:25. It accepts on-site and OKD-cluster
# senders without AUTH — leave `user` empty, or Django will try to log in to a
# server that offers no AUTH mechanism — and it does offer STARTTLS, so the
# port-derived default encrypts the hop. Set useTls "0" only for a relay that
# does not offer the extension. Leave host "" to disable sending, which falls
# back to Django's console backend.
email:
  host: ""
  port: "25"
  user: ""
  password: ""
  defaultFrom: "scd-reporting@fnal.gov"
  # "" uses the port-derived default (STARTTLS on any port but 465).
  useTls: ""

# ── Email reminders ────────────────────────────────────────────────────────────
# Nudges people to file activity reports. The web UI (Reminders → Schedules)
# owns *when* each reminder goes out; the settings here only control the driver
# that evaluates those schedules, and the links inside the mail.
reminders:
  # Absolute site root used to build links inside a reminder email. Required for
  # scheduled sends, which have no HTTP request to derive it from. Defaults to
  # https://<route.hostname> when that is set.
  baseUrl: ""
  # A recipient reminded within this many hours is skipped. 0 disables the guard.
  minIntervalHours: "20"
  # Days without an entry before someone counts as overdue.
  staleDays: "14"
  # Largest number of recipients one send will process.
  batchSize: "200"
  # Run the scheduler as a daemon thread inside the web pods instead of using
  # the CronJob below. Safe with several gunicorn workers (schedules are claimed
  # atomically) but ties delivery to web-process uptime. Prefer the CronJob.
  inProcessScheduler: "0"
  cronjob:
    # The supported production driver.
    enabled: true
    # How often to *check* for due schedules — not when reminders are sent. A
    # 15-minute tick means a reminder is at most 15 minutes late.
    schedule: "*/15 * * * *"
    timeZone: "America/Chicago"
    # SQLite lives on the web Deployment's RWO PVC, so the job needs it mounted.
    # Set false when database.url points at Postgres.
    mountData: true
    deadlineSeconds: 600
    successHistory: 3
    failureHistory: 3

# ── GitHub bug-report integration ─────────────────────────────────────────────
# Prefer GitHub App credentials (appId + appInstallationId + appPrivateKey).
# Falls back to a personal access token (token) if App creds are not set.
# Set all three app fields in my-values.yaml; never commit real values here.
github:
  token: ""                  # PAT fallback — leave empty when using App auth
  appId: ""                  # numeric App ID from the App's settings page
  appInstallationId: ""      # installation ID (from /installations/<id> URL)
  appPrivateKey: ""          # PEM private key; use \n for newlines in YAML

google:
  clientId: ""
  clientSecret: ""

# ── OIDC / Fermilab SSO (optional) ────────────────────────────────────────────
oidc:
  providerUrl: ""
  clientId: ""
  clientSecret: ""

# ── HashiCorp Vault (optional) ────────────────────────────────────────────────
# When token is non-empty the pod gets VAULT_ADDR / VAULT_TOKEN and can fetch
# its own secrets at startup. Never set the token here — generate it at deploy
# time with scripts/get-vault-apptoken.sh, which writes a values fragment:
#   ./scripts/get-vault-apptoken.sh --format values -o /tmp/vault-values.yaml
#   ./scripts/deploy.sh -f my-values.yaml --vault
# The token is short-lived, so a redeploy is needed once it expires.
vault:
  addr: ""
  role: "scd-mu2e-app"
  mount: "auth/td-approles"
  token: ""                  # REQUIRED at deploy time only — never commit
  # KV v2 prefix holding this deployment's secrets, mount included. The app
  # reads the per-service sections beneath it (django, oidc, email, ...).
  # Set addr AND secretPath to turn the loader on:
  #   test -> okd/shared/test/scd-reporting
  #   prod -> okd/shared/prod/scd-reporting
  secretPath: ""
  # "1" lets the pod start when Vault is unreachable, falling back to whatever
  # the ConfigMap/Secret provide. Default is fail-fast so a missing secret is
  # loud rather than a silent boot with an insecure default SECRET_KEY.
  optional: ""
